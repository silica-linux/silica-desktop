<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" font-family="Inter, sans-serif" font-size="11">
  <title>Menu bar: title boxes, open-title capsule and first menu (SH-MB-01, 1 unit = 1.5 pt drawn at 1.5×)</title>
  <rect width="700" height="170" fill="#ffffff"/>
  <g transform="translate(10 20) scale(1.5)">
    <rect x="0" y="0" width="440" height="30" fill="#6f7075"/>
    <!-- title boxes -->
    <g fill="none" stroke="#ffd36b" stroke-width="0.6">
      <rect x="10" y="3" width="34" height="24"/>
      <rect x="43" y="3" width="62" height="24"/>
      <rect x="104" y="3" width="42" height="24"/>
      <rect x="145" y="3" width="73" height="24"/>
      <rect x="217" y="3" width="51" height="24"/>
      <rect x="267" y="3" width="40" height="24"/>
      <rect x="306" y="3" width="69" height="24"/>
      <rect x="374" y="3" width="53" height="24"/>
    </g>
    <!-- open capsule around title 1 -->
    <rect x="101" y="3" width="49.5" height="24" rx="12" fill="#7e7f84"/>
    <line x1="0" y1="19" x2="440" y2="19" stroke="#ffffff" stroke-width="0.3" stroke-dasharray="1 1"/>
    <!-- menu below -->
    <rect x="99" y="31" width="80" height="40" rx="12" fill="#c7c8cd" stroke="#5d5d61" stroke-width="0.5"/>
  </g>
  <g fill="#333">
    <text x="20" y="80">bar 30 pt; titles: text + ~21 pt; baseline y 19</text>
    <text x="20" y="96">first box at x 10 (logo, 34 wide); boxes overlap 1 pt</text>
    <text x="20" y="112">open title: capsule 24 tall, r 12, box + ~7 pt</text>
    <text x="20" y="128">menu: left edge 5 pt left of the box, top at y 31, radius 12</text>
  </g>
</svg>
