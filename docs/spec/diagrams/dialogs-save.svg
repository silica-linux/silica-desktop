<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Inter, sans-serif" font-size="11">
  <title>Save panel, compact card (MU-95), drawn at 1.2× (1.2 units = 1 pt)</title>
  <rect width="640" height="320" fill="#ffffff"/>
  <g transform="translate(20 20) scale(1.2)">
    <rect x="0" y="0" width="413" height="218" rx="19" fill="#ffffff" stroke="#a6a6a6" stroke-width="0.8"/>
    <g fill="#f2f2f2" stroke="#c1c1c1" stroke-width="0.6">
      <rect x="142" y="24" width="232" height="26" rx="6"/>
      <rect x="142" y="60" width="232" height="27" rx="6"/>
      <rect x="142" y="97" width="232" height="26" rx="6"/>
      <rect x="142" y="133" width="200" height="26" rx="6"/>
      <rect x="348" y="133" width="26" height="26" rx="6"/>
      <rect x="226" y="178" width="81" height="26" rx="13"/>
