<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="Inter, sans-serif" font-size="10">
  <title>Dock launch bounce: height above rest over time (two jumps, 1.42 s)</title>
  <rect width="520" height="200" fill="#ffffff"/>
  <!-- axes: x 1 s = 300 px from x=40; y 1 pt = 6 px, base y=160 -->
  <line x1="40" y1="160" x2="500" y2="160" stroke="#000"/>
  <line x1="40" y1="160" x2="40" y2="40" stroke="#000"/>
  <text x="44" y="38">height (pt)</text>
  <text x="470" y="176">time (s)</text>
  <text x="34" y="62" text-anchor="end">17</text>
  <line x1="36" y1="58" x2="44" y2="58" stroke="#000"/>
  <polyline fill="none" stroke="#3b99fd" stroke-width="2"
    points="40,148 52,130 64,112 79,94 88,82 103,76 127,58 172,76 199,94 217,118 235,142 247,160
            255,130 265,112 280,94 300,76 330,61 360,64 385,82 405,106 420,130 433,160"/>
  <text x="247" y="176" text-anchor="middle">0.69</text>
  <text x="433" y="176" text-anchor="middle">1.42</text>
  <text x="40" y="176" text-anchor="middle">0</text>
  <text x="300" y="30">indicator dot fades in from the 2nd peak to landing</text>
</svg>
