<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" font-family="Inter, sans-serif" font-size="11">
  <title>Control Center grid (SH-CC-01), 1 unit = 1 pt; origin at the stack's top-left corner (x 2254, y 70)</title>
