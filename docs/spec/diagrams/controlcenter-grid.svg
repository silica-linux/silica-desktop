  <g transform="translate(20 40)">
    <rect x="-20" y="-40" width="420" height="640" fill="#7a7b80" opacity="0.15"/>
    <g fill="#6a6b70" stroke="#26272b" stroke-width="1">
      <rect x="0" y="0" width="140" height="64" rx="32"/>
      <rect x="0" y="76" width="140" height="64" rx="32"/>
      <rect x="152" y="0" width="140" height="140" rx="35"/>
      <rect x="0" y="152" width="140" height="64" rx="32"/>
      <circle cx="184" cy="184" r="32"/>
      <circle cx="260" cy="184" r="32"/>
      <circle cx="32" cy="260" r="32"/>
      <circle cx="108" cy="260" r="32"/>
      <rect x="152" y="228" width="140" height="64" rx="32"/>
      <rect x="0" y="304" width="292" height="64" rx="28"/>
      <rect x="0" y="380" width="292" height="64" rx="28"/>
