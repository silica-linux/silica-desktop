      <text x="300" y="198">circles</text>
      <text x="300" y="340">292 × 64</text>
      <text x="300" y="354">r 28</text>
      <text x="0" y="520">gaps 12 pt · row pitch 76 · stack 292 wide, 14 pt from the screen edge</text>
