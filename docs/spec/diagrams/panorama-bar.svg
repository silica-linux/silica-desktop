<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Inter, sans-serif" font-size="11">
  <title>Panorama spaces bar, compact and expanded (scale 1:4)</title>
  <rect width="680" height="260" fill="#ffffff"/>
  <!-- compact: 2560x40 at 1:4 -> 640x10 -->
  <text x="20" y="18">Compact: 40 pt tall</text>
  <rect x="20" y="24" width="640" height="10" fill="#9e9fa5"/>
  <rect x="317" y="25.75" width="22.5" height="6" rx="1.7" fill="#87888e" stroke="#8d8e94" stroke-width="0.25"/>
  <text x="328" y="44" text-anchor="middle" font-size="9">current space in a 24 pt capsule</text>
  <text x="633" y="31" font-size="9">+</text>
  <!-- expanded: 170 tall -> 42.5 -->
  <text x="20" y="80">Expanded: 170 pt tall</text>
  <rect x="20" y="86" width="640" height="42.5" fill="#a1a2a8"/>
  <!-- thumbnails 160x90 at y52 -> 40x22.5 at y 13; pitch 192 -> 48 -->
  <rect x="270" y="99" width="40" height="22.5" fill="#7a7b80"/>
  <rect x="269" y="98" width="42" height="24.5" fill="none" stroke="#3b99fd" stroke-width="0.75"/>
  <rect x="318" y="99" width="40" height="22.5" fill="#7a7b80"/>
  <text x="290" y="136" text-anchor="middle" font-size="8">Desktop 1</text>
  <text x="338" y="136" text-anchor="middle" font-size="8">Desktop 2</text>
  <text x="631" y="113" font-size="9">+</text>
  <!-- dimensions -->
  <line x1="270" y1="160" x2="310" y2="160" stroke="#000"/>
  <text x="290" y="172" text-anchor="middle">160 pt</text>
  <line x1="270" y1="185" x2="318" y2="185" stroke="#000"/>
  <text x="294" y="197" text-anchor="middle">pitch 192 pt (gap 32)</text>
  <text x="20" y="225">Thumbnail 160 × 90 pt, top at y 52; current space: 3 pt ring sRGB #3b99fd, 1 pt away.</text>
  <text x="20" y="243">"+": 20 × 20 pt cross, 2 pt stroke, 16 pt from the right edge.</text>
</svg>
