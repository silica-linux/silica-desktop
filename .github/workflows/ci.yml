name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libudev-dev libinput-dev \
            libgbm-dev libseat-dev libpixman-1-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri \
            unzip fontconfig fonts-dejavu-core dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Same engine version as in crates/embedder/ENGINE_VERSION: the bundles built
      # by the SDK run only on the engine of the same SDK (cargo xtask engine checks it).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/flutter-engine
          key: flutter-engine-${{ hashFiles('crates/embedder/ENGINE_VERSION') }}
      # Engine, bundle demo, flutter analyze/test, fmt, clippy, test, layers, assets, unsafe.
      - run: cargo xtask ci
