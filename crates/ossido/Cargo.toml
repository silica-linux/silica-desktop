[package]
name = "ossido"
description = "Ossido, il compositor Wayland di Silica"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
ossido-render = { path = "../ossido-render" }
png = "0.17"
serde = "1"
serde_json = "1"
silica-control = { path = "../control" }
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "renderer_gl", "renderer_pixman", "wayland_frontend", "desktop"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[lints]
workspace = true
