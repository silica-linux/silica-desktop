[package]
name = "silica-dock-iced"
description = "Prototipo del Dock in Rust con iced (M1.5), per il confronto con apps/dock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dock-iced"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas"] }
iced_layershell = "0.19"
# iced_layershell 0.19.1 non compila con winit-core 0.31.0-beta.3 (variante nuova in
# NativeKeyCode): si fissa la beta con cui è stato pubblicato.
winit-core = "=0.31.0-beta.2"
winit-common = "=0.31.0-beta.2"

[lints]
workspace = true
