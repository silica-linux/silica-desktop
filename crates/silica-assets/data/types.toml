# Source table of the TYPE-adjacent key spaces of silica.assets: which file type icon (an id of
# silica-icons `files/`) a MIME type, a UTI alias or a file name extension resolves to, and which
# icon a desktop application id resolves to. The compiler fails if a target is not an icon of the
# sources it compiles.
#
# [mime] is the `icons.mime` map of silica-icons `files/file-generic/icon.json` (the label
# category of the generic file, e.g. "data", is not kept here); a key ending in `/*` is a wildcard
# the reader tries after the exact type. [ext] is its `icons.extensions` map.

# The app icons in silica.assets are the shell's own: the Launcher, Mission Control, Screenshot
# and the Silica mark. The icons of the other Silica apps live in each app's repository
# (`icon/`, docs/assets-format.md "App icons"). Sources without this key compile every app icon
# (the test fixtures do that).
shell_apps = ["apps", "mission-control", "screenshot", "silica"]

[app]
"dev.frascella.Apps" = "apps"
"dev.frascella.MissionControl" = "mission-control"
"dev.frascella.Screenshot" = "screenshot"

