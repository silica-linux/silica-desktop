[package]
name = "silica-embedder"
description = "Flutter embedder in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-channel = "2"
async-executor = "1"
async-io = "2"
async-lock = "3"
futures-lite = "2"
libloading = "0.8"
rustix = { version = "1", features = ["fs", "process", "pty", "std", "termios"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
serde_json = "1"
silica-control = { path = "../control" }
silica-protocols = { path = "../protocols", features = ["client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
khronos-egl = { version = "6", default-features = false, features = ["1_5", "dynamic"] }
wayland-egl = "0.32"
wayland-backend = { version = "0.3", features = ["client_system"] }
zbus = "5.19"

[dev-dependencies]
ossido = { path = "../ossido" }
png = "0.17"
serde_json = "1"
silica-control = { path = "../control" }

[lints]
workspace = true
