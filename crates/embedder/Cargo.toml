[package]
name = "silica-embedder"
description = "Embedder Flutter in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
libloading = "0.8"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
serde_json = "1"
silica-protocols = { path = "../protocols", features = ["client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
khronos-egl = { version = "6", default-features = false, features = ["1_5", "dynamic"] }
wayland-egl = "0.32"
wayland-backend = { version = "0.3", features = ["client_system"] }

[dev-dependencies]
ossido = { path = "../ossido" }
png = "0.17"
serde_json = "1"
silica-control = { path = "../control" }

[lints]
workspace = true
