[package]
name = "silica-daemon"
description = "Silica system services (D-Bus)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "silica-daemon"
path = "src/main.rs"

[dependencies]
async-channel = "2"
async-io = "2"
async-process = "2"
blocking = "1"
event-listener = "5"
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
md5 = "0.7"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silica-control = { path = "../control" }
tracing = "0.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = "5.19"
