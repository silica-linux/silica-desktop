[package]
name = "silica-daemon"
description = "Silica system services (D-Bus)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "silica-daemon"
path = "src/main.rs"

[dependencies]
async-io = "2"
async-process = "2"
event-listener = "5"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
zbus = "5.19"
