[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silica-os/silica-desktop"

[workspace.lints.rust]
# "deny" and not "forbid": the embedder's FFI and Ossido's EGL re-enable it, only there
# (cargo xtask unsafe).
unsafe_code = "deny"

# Never crash: see AGENTS.md. They are allowed in tests (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
