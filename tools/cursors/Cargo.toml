[package]
name = "silica-cursors-gen"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Standalone on purpose: run by hand when the kit changes; the XCursor files it writes are
# committed under data/cursors/. Not a workspace member (keeps resvg out of the CI build).
[workspace]

[dependencies]
resvg = { version = "0.45", default-features = false }
serde_json = "1"
